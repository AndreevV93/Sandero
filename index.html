<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Книжка Stepway</title>
  <meta name="description" content="Сервисная книжка Renault Sandero Stepway II 2018. Один файл для GitHub Pages." />
  <meta name="theme-color" content="#1e4638" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e4638'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f3eee4'/%3E%3Crect x='8' y='6' width='4' height='20' fill='%238a4516'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3eee4;
      --sheet: #fbf8f2;
      --ink: #1c1915;
      --muted: #6e665c;
      --line: #e3d9c9;
      --pine: #1e4638;
      --pine-fg: #f4f0e6;
      --copper: #8a4516;
      --copper-soft: #f3e2d2;
      --danger: #8e2f2a;
      --danger-soft: #f6e4e1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .wrap { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem 6.5rem; }
    .mast { border-left: 4px solid var(--pine); padding-left: 1rem; }
    .kicker { margin: 0; color: var(--copper); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; }
    h1, h2, .odo-num { font-family: Fraunces, ui-serif, Georgia, serif; font-weight: 560; }
    h1 { margin: 0.15rem 0 0; font-size: 2.4rem; line-height: 1; }
    h2 { margin: 0; font-size: 1.6rem; line-height: 1.15; }
    .sub { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.9rem; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--sheet); border-top: 1px solid var(--line);
    }
    nav.tabs button {
      min-height: 3.5rem; border: 0; background: transparent; color: var(--muted);
      font-size: 0.75rem; font-weight: 700;
    }
    nav.tabs button.on { color: var(--pine); }
    @media (min-width: 768px) {
      .wrap { padding-bottom: 2.5rem; }
      nav.tabs { position: static; margin-top: 1.25rem; border-top: 0; border-bottom: 1px solid var(--line); background: transparent; }
      nav.tabs button { font-size: 0.95rem; }
    }
    .card { background: var(--sheet); border: 1px solid var(--line); border-radius: 0.85rem; padding: 1.15rem; }
    .row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.8rem; }
    .odo-num { margin: 0; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
    .odo-num span, .muted { color: var(--muted); font-family: Manrope, sans-serif; font-size: 1rem; font-weight: 500; }
    .btn {
      min-height: 2.75rem; border-radius: 0.6rem; border: 1px solid var(--line);
      background: var(--sheet); color: var(--ink); padding: 0 0.9rem; font-weight: 700; font-size: 0.9rem;
    }
    .btn.primary { background: var(--pine); color: var(--pine-fg); border-color: var(--pine); }
    .btn.danger { color: var(--danger); border: 0; background: transparent; padding-left: 0; }
    .btn.link { border: 0; background: transparent; color: var(--pine); padding: 0; }
    .stack { display: grid; gap: 0.75rem; }
    .split { display: grid; gap: 0.75rem; }
    @media (min-width: 640px) { .split { grid-template-columns: 1fr 1fr; } }
    .list { list-style: none; margin: 0.6rem 0 0; padding: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .list li { padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
    .list li:last-child { border-bottom: 0; }
    .item-btn { width: 100%; display: flex; justify-content: space-between; gap: 0.75rem; text-align: left; background: none; border: 0; padding: 0; }
    .pill { flex: none; border-radius: 999px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 700; }
    .overdue { background: var(--danger-soft); color: var(--danger); }
    .soon { background: var(--copper-soft); color: var(--copper); }
    .ok { border: 1px solid var(--line); color: var(--pine); }
    .unknown { border: 1px solid var(--line); color: var(--muted); }
    .group { margin: 0.4rem 0; color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    label { display: block; font-size: 0.9rem; font-weight: 700; }
    input, select, textarea {
      width: 100%; margin-top: 0.25rem; background: var(--paper); border: 1px solid var(--line);
      border-radius: 0.6rem; padding: 0.7rem 0.75rem; outline: none;
    }
    textarea { min-height: 4.2rem; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--pine); }
    .choice { width: 100%; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 0.85rem; padding: 0.75rem 0.9rem; }
    .choice.on { border-color: var(--pine); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .check { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.35rem 0; font-weight: 500; }
    .check input { width: 1.15rem; height: 1.15rem; margin-top: 0.2rem; accent-color: var(--pine); }
    .sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(28, 25, 21, 0.4); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: min(100%, 34rem); max-height: 92vh; overflow: auto; background: var(--sheet); border-radius: 1rem 1rem 0 0; padding: 1rem 1rem 1.4rem; }
    @media (min-width: 768px) {
      .sheet-back { align-items: center; padding: 1.5rem; }
      .sheet { border-radius: 0.9rem; }
    }
    .err { color: var(--danger); font-size: 0.9rem; }
    .hide { display: none; }
    .notice { margin: 0 0 1rem; }
    a { color: var(--pine); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <p class="kicker">RENAULT · DACIA</p>
      <h1>Stepway II</h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <nav class="tabs" aria-label="Разделы">
      <button type="button" data-act="tab" data-tab="home">Обзор</button>
      <button type="button" data-act="tab" data-tab="log">Журнал</button>
      <button type="button" data-act="tab" data-tab="plan">Регламент</button>
      <button type="button" data-act="tab" data-tab="settings">Настройки</button>
    </nav>
    <main id="app" style="margin-top:1.25rem"></main>
  </div>
  <div id="modal"></div>
  <script>
    const KEY = "sandero-book-v1";
    const ENGINES = [
      { id: "k7m", label: "K7M · 1.6 8 кл. · 82 л.с.", short: "K7M 82", blurb: "Ремень ГРМ, без гидрокомпенсаторов, масло 3,4 л. Частый мотор версии без кондиционера." },
      { id: "k4m", label: "K4M · 1.6 16 кл. · 102 л.с.", short: "K4M 102", blurb: "Ремень ГРМ, гидрокомпенсаторы есть, масло 4,8 л." },
      { id: "h4m", label: "H4M · 1.6 16 кл. · 113 л.с.", short: "H4M 113", blurb: "Цепь ГРМ, без гидрокомпенсаторов, масло 4,8 л. Цепь планово не меняют." }
    ];
    const GEARBOXES = [
      { id: "mt", label: "МКПП" },
      { id: "at", label: "АКПП DP2" },
      { id: "cvt", label: "Вариатор" }
    ];
    const CATS = ["Двигатель", "Трансмиссия", "Подвеска и рулевое", "Тормоза", "Электрика", "Кузов и салон", "Шины и диски", "Прочее"];
    const GROUPS = ["Двигатель", "Фильтры", "Жидкости", "ГРМ и привод", "Тормоза", "Трансмиссия", "Осмотр"];
    const ITEMS = [
      { id: "oil", title: "Моторное масло", group: "Двигатель", km: 15000, months: 12, severe: true, detail: "15 000 км или 1 год. RN0700/RN0710, 5W-30 или 5W-40. K7M — 3,4 л; K4M и H4M — 4,8 л. В тяжёлых условиях — 7 500 км или 6 месяцев." },
      { id: "oil-filter", title: "Масляный фильтр", group: "Фильтры", km: 15000, months: 12, severe: true, detail: "Вместе с маслом. K7M и K4M — 7700274177. H4M — 152085758R." },
      { id: "drain-washer", title: "Прокладка сливной пробки", group: "Двигатель", km: 15000, months: 12, severe: true, detail: "Одноразовая при каждой замене масла. K7M и K4M — 110265505R. H4M — 1102601M02." },
      { id: "air-filter", title: "Воздушный фильтр", group: "Фильтры", km: 15000, months: 12, severe: true, detail: "15 000 км или 1 год. K7M — 165469466R. K4M — 8200431051. H4M — 165460509R." },
      { id: "cabin-filter", title: "Салонный фильтр", group: "Фильтры", km: 15000, months: 12, severe: true, cabin: true, detail: "15 000 км или 1 год, 272773277R. Без климата его часто нет — включите в настройках, только если стоит." },
      { id: "spark-plugs", title: "Свечи зажигания", group: "Двигатель", km: 30000, months: 24, detail: "30 000 км или 2 года, 4 шт. K7M — 7700500168. K4M — 7700500155. H4M — 224019372R (на Sandero тоже 30 000 км)." },
      { id: "brake-fluid", title: "Тормозная жидкость", group: "Жидкости", km: 90000, months: 36, detail: "90 000 км или 3 года. DOT 4+, около 0,7 л. Срок обычно важнее пробега." },
      { id: "coolant", title: "Охлаждающая жидкость", group: "Жидкости", km: 90000, months: 72, detail: "90 000 км или 6 лет. Glaceol RX Type D, жёлтая, около 5,45 л. Не смешивать с другими типами." },
      { id: "timing-belt", title: "Ремень ГРМ с роликами", group: "ГРМ и привод", km: 90000, months: 48, engines: ["k7m", "k4m"], detail: "С 2015 года, включая 2018: 90 000 км или 4 года. Ролики вместе с ремнём. Обрыв на K7M и K4M гнёт клапаны. Помпу часто меняют сразу." },
      { id: "timing-chain", title: "Контроль цепи ГРМ", group: "ГРМ и привод", km: 15000, months: 12, engines: ["h4m"], detail: "У H4M цепь планово не меняют. На каждом ТО слушают холодный пуск. Замена только при шуме или растяжении." },
      { id: "aux-belt", title: "Ремень генератора с роликами", group: "ГРМ и привод", km: 90000, months: 48, detail: "С 2015 года: 90 000 км или 4 года. Без кондиционера компрессора нет, интервал тот же." },
      { id: "valve-k7m", title: "Регулировка зазоров клапанов", group: "Двигатель", km: 60000, months: null, engines: ["k7m"], detail: "K7M без гидрокомпенсаторов: каждые 60 000 км." },
      { id: "valve-h4m", title: "Проверка зазоров клапанов", group: "Двигатель", km: 100000, months: null, engines: ["h4m"], detail: "H4M: проверка около 100 000 км, регулировка толкателями." },
      { id: "rear-brakes-clean", title: "Очистка задних барабанов", group: "Тормоза", km: 60000, months: null, detail: "По карте Renault для задних барабанов: очистка пыли каждые 60 000 км." },
      { id: "gearbox-mt", title: "Масло МКПП", group: "Трансмиссия", km: 90000, months: null, gears: ["mt"], rec: true, detail: "Завод часто пишет «на весь срок». JR5, около 2,5 л, GL-4 75W-80. Разумно около 90 000 км." },
      { id: "gearbox-at", title: "Масло АКПП", group: "Трансмиссия", km: 60000, months: null, gears: ["at"], rec: true, detail: "DP2, MATIC D3. Частичная замена около 4 л каждые 60 000 км." },
      { id: "gearbox-cvt", title: "Масло вариатора", group: "Трансмиссия", km: 40000, months: null, gears: ["cvt"], rec: true, detail: "CVTF, ориентир около 40 000 км." },
      { id: "inspect-brakes", title: "Осмотр тормозов", group: "Осмотр", km: 15000, months: 12, detail: "Колодки, диски, барабаны, шланги. Износ колодок отмечайте как ремонт, не как срок." },
      { id: "inspect-suspension", title: "Подвеска, рулевое, пыльники", group: "Осмотр", km: 15000, months: 12, detail: "Сайлентблоки, шаровые, стойки, пыльники ШРУС, люфт рулевого." },
      { id: "inspect-fluids", title: "Уровни жидкостей", group: "Осмотр", km: 15000, months: 12, detail: "Масло, антифриз, тормозная, омыватель. ГУР на Stepway 2018 электрический." },
      { id: "inspect-battery", title: "Аккумулятор и клеммы", group: "Осмотр", km: 15000, months: 12, detail: "Клеммы и заряд. Саму батарею на 4–6 году пишите как ремонт." },
      { id: "inspect-tires", title: "Шины и давление", group: "Осмотр", km: 15000, months: 12, detail: "Давление по табличке на стойке, протектор, возраст 5–6 сезонов." },
      { id: "inspect-lights", title: "Свет и стеклоочистители", group: "Осмотр", km: 15000, months: 12, detail: "Фары, стопы, повороты, номер, щётки, омыватель." },
      { id: "inspect-exhaust", title: "Выпуск и днище", group: "Осмотр", km: 15000, months: 12, detail: "Глушитель, гофра, коррозия днища и тормозных трубок." }
    ];
    const PRESETS = [
      { id: "oil", title: "Масло и фильтр", ids: ["oil", "oil-filter", "drain-washer"] },
      { id: "to15", title: "Базовое ТО", ids: ["oil", "oil-filter", "drain-washer", "air-filter", "cabin-filter", "inspect-brakes", "inspect-suspension", "inspect-fluids", "inspect-battery", "inspect-tires", "inspect-lights", "inspect-exhaust"] },
      { id: "plugs", title: "Свечи", ids: ["spark-plugs"] },
      { id: "timing", title: "ГРМ и ремень", ids: ["timing-belt", "timing-chain", "aux-belt"] },
      { id: "fluids", title: "Жидкости", ids: ["brake-fluid", "coolant"] }
    ];
    const defaults = { engine: "k7m", gearbox: "mt", severe: false, hasCabinFilter: false, warnKm: 2000, warnDays: 30, plate: "", vin: "", jsonbinMasterKey: "", jsonbinBinId: "" };
    let state = load();
    let tab = "home";
    let notice = "";
    let planQuery = "";

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "null");
        return sanitize(raw) || fresh();
      } catch { return fresh(); }
    }
    function fresh() { return { settings: { ...defaults }, logs: [], readings: [] }; }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return (crypto.randomUUID && crypto.randomUUID()) || ("id-" + Date.now()); }
    function today() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function parseDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); }
    function iso(date) { return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0"); }
    function addMonths(value, months) {
      const date = parseDate(value); const day = date.getDate();
      date.setDate(1); date.setMonth(date.getMonth() + months);
      const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      date.setDate(Math.min(day, last)); return iso(date);
    }
    function addDays(value, days) { const date = parseDate(value); date.setDate(date.getDate() + days); return iso(date); }
    function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
    function fmtKm(n) { return new Intl.NumberFormat("ru-RU").format(Math.round(n)); }
    function fmtDate(value) { return value ? new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short", year: "numeric" }).format(parseDate(value)) : "—"; }
    function fmtMoney(n) { return new Intl.NumberFormat("ru-RU", { style: "currency", currency: "RUB", maximumFractionDigits: 0 }).format(n); }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => {
        if (c === "&") return "&" + "amp;";
        if (c === "<") return "&" + "lt;";
        if (c === ">") return "&" + "gt;";
        if (c === '"') return "&" + "quot;";
        return "&" + "#39;";
      });
    }
    function num(v) { const n = Number(String(v).replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : null; }
    function applies(item) {
      const s = state.settings;
      if (item.cabin && !s.hasCabinFilter) return false;
      if (item.engines && !item.engines.includes(s.engine)) return false;
      if (item.gears && !item.gears.includes(s.gearbox)) return false;
      return true;
    }
    function applicable() { return ITEMS.filter(applies); }
    function spanOf(item) {
      let km = item.km, months = item.months;
      if (state.settings.severe && item.severe) {
        if (km) km = Math.round(km / 2);
        if (months) months = Math.max(1, Math.round(months / 2));
      }
      return { km, months };
    }
    function currentKm() {
      const all = state.readings.map((r) => r.km).concat(state.logs.map((l) => l.km));
      return all.length ? Math.max(...all) : null;
    }
    function rate() {
      const pts = state.readings.map((r) => ({ date: r.date, km: r.km })).concat(state.logs.map((l) => ({ date: l.date, km: l.km }))).filter((p) => p.date).sort((a, b) => a.date.localeCompare(b.date) || a.km - b.km);
      if (pts.length < 2) return null;
      const days = daysBetween(pts[0].date, pts[pts.length - 1].date);
      const delta = pts[pts.length - 1].km - pts[0].km;
      if (days < 7 || delta <= 0) return null;
      return delta / days;
    }
    function lastLog(id) {
      const hits = state.logs.filter((l) => l.kind === "scheduled" && (l.itemIds || []).includes(id));
      hits.sort((a, b) => b.date.localeCompare(a.date) || b.km - a.km);
      return hits[0] || null;
    }
    function statusFor(item) {
      const span = spanOf(item);
      const last = lastLog(item.id);
      const odo = currentKm();
      const now = today();
      const row = { item, urgency: "unknown", last, kmLeft: null, daysLeft: null, dueDate: null, eta: null, span };
      if (!last) return row;
      if (span.km != null && odo != null) row.kmLeft = span.km - Math.max(0, odo - last.km);
      if (span.months != null) { row.dueDate = addMonths(last.date, span.months); row.daysLeft = daysBetween(now, row.dueDate); }
      const warnKm = Math.max(100, state.settings.warnKm || 0);
      const warnDays = Math.max(1, state.settings.warnDays || 0);
      const kmBad = row.kmLeft != null && row.kmLeft <= 0;
      const timeBad = row.daysLeft != null && row.daysLeft <= 0;
      const kmSoon = row.kmLeft != null && row.kmLeft > 0 && row.kmLeft <= warnKm;
      const timeSoon = row.daysLeft != null && row.daysLeft > 0 && row.daysLeft <= warnDays;
      row.urgency = kmBad || timeBad ? "overdue" : kmSoon || timeSoon ? "soon" : "ok";
      const perDay = rate();
      if (perDay && row.kmLeft > 0) row.eta = addDays(now, Math.round(row.kmLeft / perDay));
      return row;
    }
    function statuses() {
      return applicable().map(statusFor).sort((a, b) => rank(a) - rank(b));
    }
    function rank(s) {
      const bias = s.urgency === "overdue" ? 0 : s.urgency === "soon" ? 1 : s.urgency === "ok" ? 2 : 3;
      const ratios = [];
      if (s.kmLeft != null && s.span.km) ratios.push(s.kmLeft / s.span.km);
      if (s.daysLeft != null && s.span.months) ratios.push(s.daysLeft / (s.span.months * 30.44));
      return bias * 100 + (ratios.length ? Math.min(...ratios) : 99);
    }
    function intervalLabel(span) {
      const parts = [];
      if (span.km) parts.push(fmtKm(span.km) + " км");
      if (span.months) {
        if (span.months % 12 === 0) {
          const y = span.months / 12;
          parts.push(y === 1 ? "1 год" : y < 5 ? y + " года" : y + " лет");
        } else parts.push(span.months + " мес.");
      }
      return parts.join(" или ") || "по состоянию";
    }
    function remain(s) {
      if (s.urgency === "unknown") return "Нет отметки — книжка не знает, когда делали";
      const bits = [];
      if (s.kmLeft != null) bits.push(s.kmLeft <= 0 ? "пробег просрочен на " + fmtKm(Math.abs(s.kmLeft)) + " км" : "ещё " + fmtKm(s.kmLeft) + " км");

      if (act === "pull") return pullBin();
      if (act === "download") {
        const blob = new Blob([JSON.stringify(exportDoc(), null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob); const a = document.createElement("a");
        a.href = url; a.download = "stepway-service.json"; a.click(); URL.revokeObjectURL(url); return;
      }
      if (act === "pick") { document.getElementById("file").click(); return; }
      if (act === "reset") {
        const key = state.settings.jsonbinMasterKey, bin = state.settings.jsonbinBinId;
        state = fresh(); state.settings.jsonbinMasterKey = key; state.settings.jsonbinBinId = bin;
        save(); notice = "Записи стёрты. Ключ JSONBin оставлен."; render();
      }
    });
    document.addEventListener("change", (event) => {
      const t = event.target;
      if (t.dataset && t.dataset.act === "check") {
        if (t.checked) selected.push(t.value); else selected = selected.filter((id) => id !== t.value);
        const label = document.querySelector("#catalog") && document.querySelector(".sheet .muted");
        const hint = document.querySelector(".sheet p.muted:last-of-type");
        if (hint && hint.textContent.startsWith("Выбрано")) hint.textContent = "Выбрано: " + selected.length;
        return;
      }
      if (t.id === "file" && t.files && t.files[0]) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = sanitize(JSON.parse(String(reader.result)));
            if (!parsed) throw new Error("bad");
            parsed.settings.jsonbinMasterKey = state.settings.jsonbinMasterKey || parsed.settings.jsonbinMasterKey;
            parsed.settings.jsonbinBinId = parsed.settings.jsonbinBinId || state.settings.jsonbinBinId;
            state = parsed; save(); notice = "Файл прочитан."; render();
          } catch { notice = "Этот JSON не похож на книжку Stepway."; render(); }
        };
        reader.readAsText(t.files[0]);
      }
      const map = { plate: "plate", vin: "vin", warnKm: "warnKm", warnDays: "warnDays", binKey: "jsonbinMasterKey", binId: "jsonbinBinId" };
      if (map[t.id]) {
        let value = t.value;
        if (t.id === "vin") value = value.toUpperCase();
        if (t.id === "warnKm" || t.id === "warnDays") value = Math.max(0, Math.round(Number(value) || 0));
        if (t.id === "binId") value = value.trim();
        state.settings[map[t.id]] = value;
        save();
        if (t.id === "plate") {
          const eng = engine();
          document.getElementById("subtitle").textContent = "2018 · без кондиционера · " + eng.short + (value ? " · " + value : "") + (state.settings.severe ? " · тяжёлые условия" : "") + " · файл для GitHub Pages";
        }
      }
    });
    document.addEventListener("input", (event) => {
      if (event.target.id !== "q") return;
      planQuery = event.target.value;
      const pos = event.target.selectionStart;
      render();
      const field = document.getElementById("q");
      if (field) {
        field.focus();
        field.setSelectionRange(pos, pos);
      }
    });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeSheet(); });
    render();
  </script>
</body>
</html>
